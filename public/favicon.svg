<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="React + Vitest Practice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b1f2a"/>
      <stop offset="100%" stop-color="#0d1017"/>
    </linearGradient>
    <linearGradient id="atom" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#61dafb"/>
      <stop offset="100%" stop-color="#3ba9c9"/>
    </linearGradient>
    <linearGradient id="liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ee787"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
    <linearGradient id="check" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a5d6ff"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="none" stroke="#2b3240" stroke-width="2"/>

  <!-- Test tube -->
  <g transform="translate(64 62)">
    <!-- tube body -->
    <path d="M -16 -34 L -16 26 a 16 16 0 0 0 32 0 L 16 -34"
          fill="none" stroke="#3a4557" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- liquid -->
    <path d="M -14 6 L -14 26 a 14 14 0 0 0 28 0 L 14 6 Z" fill="url(#liquid)" opacity="0.85"/>
    <!-- rim -->
    <line x1="-22" y1="-34" x2="22" y2="-34" stroke="#3a4557" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- React atom inside the tube -->
  <g transform="translate(64 34)">
    <circle r="3.2" fill="url(#atom)"/>
    <g stroke="url(#atom)" stroke-width="2.2" fill="none">
      <ellipse rx="15" ry="6"/>
      <ellipse rx="15" ry="6" transform="rotate(60)"/>
      <ellipse rx="15" ry="6" transform="rotate(120)"/>
    </g>
  </g>

  <!-- Bubbles -->
  <circle cx="58" cy="66" r="2.6" fill="#7ee787" opacity="0.9"/>
  <circle cx="70" cy="74" r="1.9" fill="#7ee787" opacity="0.75"/>
  <circle cx="60" cy="82" r="1.5" fill="#7ee787" opacity="0.6"/>

  <!-- Checkmark badge -->
  <g transform="translate(96 96)">
    <circle r="17" fill="#0d1017"/>
    <circle r="15" fill="url(#check)"/>
    <path d="M -7 0.5 L -2 5.5 L 7.5 -4.5"
          fill="none" stroke="#0d1017" stroke-width="3.2"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>